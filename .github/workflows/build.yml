name: Android Anti-Lag Project Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/jniLibs/arm64-v8a

    - name: Process Termux Compiled File
      run: |
        if [ -f "kk.cpp" ]; then
          cp kk.cpp app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "✅ Đã nhận diện và cấu hình file biên dịch từ Termux thành libkk.so."
        elif [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "✅ Đã cấu hình file libkk.so."
        else
          echo "❌ Lỗi: Không tìm thấy file thư viện nào ở thư mục gốc!" && exit 1
        fi

    - name: Create gradle.properties (Fix AndroidX Build Error)
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

    - name: Create Root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Create App build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.antilag.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.app"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
                
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.core:core:1.12.0'
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.antilag.app">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="false"
                android:icon="@mipmap/ic_launcher"
                android:label="AntiLag System"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.NoDisplay">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

    - name: Create AntiLagService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";
            private boolean isRunning = true;

            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Anti-Lag Service")
                        .setContentText("Hệ thống chống lag đang chạy ẩn...")
                        .setSmallIcon(android.R.drawable.ic_dialog_info)
                        .build();
                
                startForeground(1, notification);

                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (isRunning) {
                            try {
                                System.loadLibrary("kk");
                                kichHoatChongLag();
                            } catch (UnsatisfiedLinkError e) {
                                e.printStackTrace();
                            }
                            
                            try {
                                Thread.sleep(5000);
                            } catch (InterruptedException e) {
                                Thread.currentThread().interrupt();
                            }
                        }
                    }
                }).start();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                isRunning = false;
            }

            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel serviceChannel = new NotificationChannel(
                            CHANNEL_ID,
                            "Anti-Lag Service Channel",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(serviceChannel);
                    }
                }
            }
        }
        EOF

    - name: Create MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/MainActivity.java
        package com.antilag.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import androidx.core.content.ContextCompat;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                Intent intent = new Intent(this, AntiLagService.class);
                ContextCompat.startForegroundService(this, intent);
                
                finish();
            }
        }
        EOF

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
