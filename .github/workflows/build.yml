name: Build Anti-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Android Project Structure
      run: |
        # 1. Tạo các thư mục cần thiết
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/jniLibs/arm64-v8a

        # 2. Khởi tạo Gradle Wrapper chuẩn cho dự án bằng Gradle 8.5
        gradle wrapper

        # 3. Tạo file settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ":app"
        EOF

        # 4. Tạo file build.gradle gốc (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id "com.android.application" version "8.2.2" apply false
        }
        EOF

        # 5. Tạo file app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id "com.android.application"
        }

        android {
            namespace "com.antilag.app"
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.app"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # 6. Tạo file AndroidManifest.xml với các thuộc tính hợp lệ
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.antilag.app">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:label="AntiLag System"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.NoDisplay">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

        # 7. Tạo file MainActivity.java
        cat << 'EOF' > app/src/main/java/com/antilag/app/MainActivity.java
        package com.antilag.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                Intent serviceIntent = new Intent(this, AntiLagService.class);
                startForegroundService(serviceIntent);
                
                finish();
            }
        }
        EOF

        # 8. Tạo file AntiLagService.java
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.IBinder;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";
            private boolean isRunning = false;

            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
                
                Notification notification = new Notification.Builder(this, CHANNEL_ID)
                        .setContentTitle("System Optimizer")
                        .setContentText("Anti-lag service is running active.")
                        .build();
                
                startForeground(1, notification, 1073741824);
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                if (!isRunning) {
                    isRunning = true;
                    
                    new Thread(new Runnable() {
                        @Override
                        public void run() {
                            while (isRunning) {
                                try {
                                    System.loadLibrary("kk");
                                    kichHoatChongLag();
                                } catch (UnsatisfiedLinkError e) {
                                    e.printStackTrace();
                                }
                                try {
                                    Thread.sleep(5000);
                                } catch (InterruptedException e) {
                                    e.printStackTrace();
                                }
                            }
                        }
                    }).start();
                }
                return START_STICKY;
            }

            @Override
            public void onDestroy() {
                isRunning = false;
                super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void createNotificationChannel() {
                NotificationChannel serviceChannel = new NotificationChannel(
                        CHANNEL_ID,
                        "Anti-Lag Optimization Channel",
                        NotificationManager.IMPORTANCE_LOW
                );
                NotificationManager manager = getSystemService(NotificationManager.class);
                if (manager != null) {
                    manager.createNotificationChannel(serviceChannel);
                }
            }
        }
        EOF

    - name: Copy Native Library libkk.so
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Thành công: Đã sao chép libkk.so."
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!" && exit 1
        fi

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
