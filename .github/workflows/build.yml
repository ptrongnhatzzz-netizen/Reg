name: Android Anti-Lag Project Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/cpp
    - name: Move C++ Source File (kk.cpp)
      run: |
        if [ -f "kk.cpp" ]; then
          cp kk.cpp app/src/main/cpp/kk.cpp
          echo "✅ OK"
        else
          echo "❌ Lỗi: Không có kk.cpp!" && exit 1
        fi

    - name: Create CMakeLists.txt
      run: |
        echo "cmake_minimum_required(VERSION 3.22.1)" > app/src/main/cpp/CMakeLists.txt
        echo "project(\"antilag\")" >> app/src/main/cpp/CMakeLists.txt
        echo "add_library(kk SHARED kk.cpp)" >> app/src/main/cpp/CMakeLists.txt
        echo "find_library(log-lib log)" >> app/src/main/cpp/CMakeLists.txt
        echo "target_link_libraries(kk \${log-lib})" >> app/src/main/cpp/CMakeLists.txt
        mkdir -p app/src/main/cpp
        mkdir -p app/src/main/jniLibs
        mkdir -p app/src/main/java/com/antilag/app

    - name: Move C++
      run: |
        if [ -f "kk.cpp" ]; then
          cp kk.cpp app/src/main/cpp/kk.cpp
        else
          echo "No kk.cpp" && exit 1
        fi
    - name: CMake
      run: |
        C="app/src/main/cpp/CMakeLists.txt"
        echo "cmake_minimum_required(VERSION 3.22.1)" > $C
        echo "project(\"antilag\")" >> $C
        echo "add_library(kk SHARED kk.cpp)" >> $C
        echo "find_library(log-lib log)" >> $C
        echo "target_link_libraries(kk \${log-lib})" >> $C

    - name: Props
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

    - name: Root Gradle
      run: |
        echo "buildscript { repositories { google(); mavenCentral() }" > build.gradle
        echo "dependencies { classpath 'com.android.tools.build:gradle:8.5.0' } }" >> build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        echo "task clean(type: Delete) { delete rootProject.buildDir }" >> build.gradle

    - name: Settings
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement {" >> settings.gradle
        echo "repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle
        echo "repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = \"AntiLagProject\"" >> settings.gradle
        echo "include ':app'" >> settings.gradle

    - name: App Gradle
      run: |
        G="app/build.gradle"
        echo "plugins { id 'com.android.application' }" > $G
        echo "android { namespace 'com.antilag.app'" >> $G
        echo "compileSdk 34" >> $G
        echo "defaultConfig { applicationId \"com.antilag.app\"" >> $G
        echo "minSdk 26" >> $G
        echo "targetSdk 34" >> $G
        echo "versionCode 1" >> $G
        echo "versionName \"1.0\"" >> $G
        echo "ndk { abiFilters 'arm64-v8a' } }" >> $G
        echo "externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }" >> $G
        echo "compileOptions { sourceCompatibility JavaVersion.VERSION_17" >> $G
        echo "targetCompatibility JavaVersion.VERSION_17 } }" >> $G
        echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'" >> $G
        echo "implementation 'androidx.core:core:1.12.0' }" >> $G

    - name: Manifest
      run: |
        M="app/src/main/AndroidManifest.xml"
        echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > $M
        echo "<manifest xmlns:android=\"http://android.com\" package=\"com.antilag.app\">" >> $M
        echo "<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />" >> $M
        echo "<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\" />" >> $M
        echo "<application android:allowBackup=\"false\" android:label=\"AntiLag System\">" >> $M
        echo "<activity android:name=\".MainActivity\" android:exported=\"true\" android:theme=\"@android:style/Theme.NoDisplay\">" >> $M
        echo "<intent-filter><action android:name=\"android.intent.action.MAIN\" />" >> $M
        echo "<category android:name=\"android.intent.category.LAUNCHER\" /></intent-filter></activity>" >> $M
        echo "<service android:name=\".AntiLagService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"specialUse\" />" >> $M
        echo "</application></manifest>" >> $M

    - name: App Service
    run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";
            private boolean isRunning = true;
            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Anti-Lag Service")
                        .setContentText("Hệ thống chống lag đang chạy ẩn...")
                        .setSmallIcon(android.R.drawable.ic_dialog_info).build();
                startForeground(1, notification);
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (isRunning) {
                            try {
                                System.loadLibrary("kk");
                                kichHoatChongLag();
                            } catch (UnsatisfiedLinkError e) {
                                e.printStackTrace();
                            }
                            try { Thread.sleep(5000); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                        }
                    }
                }).start();
                }
            @Override
            public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }
            @Override
            public IBinder onBind(Intent intent) { return null; }
            @Override
            public void onDestroy() { super.onDestroy(); isRunning = false; }
            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel serviceChannel = new NotificationChannel(CHANNEL_ID, "Anti-Lag Channel", NotificationManager.IMPORTANCE_LOW);
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) manager.createNotificationChannel(serviceChannel);
                }
            }
        }
        EOF
    - name: Main Activity
      run: |
        A="app/src/main/java/com/antilag/app/MainActivity.java"
        echo "package com.antilag.app;" > $A
        echo "import android.app.Activity;" >> $A
        echo "import android.content.Intent;" >> $A
        echo "import android.os.Bundle;" >> $A
        echo "import androidx.core.content.ContextCompat;" >> $A
        echo "public class MainActivity extends Activity {" >> $A
        echo " @Override" >> $A
        echo " protected void onCreate(Bundle savedInstanceState) {" >> $A
        echo " super.onCreate(savedInstanceState);" >> $A
        echo -n " Intent intent = new " >> $A
        echo "Intent(this, " >> $A
        echo "AntiLagService.class);" >> $A
        echo -n " ContextCompat." >> $A
        echo -n "startForegroundService" >> $A
        echo "(this, intent);" >> $A
        echo "    finish();" >> $A
        echo "  }" >> $A
        echo "}" >> $A
    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5
    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Complete-APK
        path: app/build/outputs/apk/debug/app-debug.apk
