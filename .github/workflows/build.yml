name: Đóng Gói Ứng Dụng Anti-Lag Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn (Checkout)
      uses: actions/checkout@v4

    - name: Thiết lập Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Thiết lập Android SDK
      uses: android-actions/setup-android@v3

    - name: Khởi tạo cấu trúc thư mục dự án Android đầy đủ
      run: |
        mkdir -p app/src/main/java/com/antilag/service
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

    - name: Cấu hình tạo bộ chạy độc lập Gradle Wrapper 8.5
      run: |
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Sao chép thư viện libkk.so vào cấu trúc JNI
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Đã sao chép libkk.so thành công."
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!" && exit 1
        fi

    - name: Tạo file settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Tạo file build.gradle (Gốc)
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

    - name: Tạo file app/build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.antilag.service'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.service"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
                
                ndk {
                    abiFilters "arm64-v8a"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

    - name: Tạo file chuỗi tài nguyên (strings.xml)
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Anti Lag Service</string>
        </resources>
        EOF

    - name: Tạo file AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.NoDisplay">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

    - name: Tạo file mã nguồn Java MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/service/MainActivity.java
        package com.antilag.service;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Build;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                Intent intent = new Intent(this, AntiLagService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(intent);
                } else {
                    startService(intent);
                }
                finish();
            }
        }
        EOF

    - name: Tạo file dịch vụ Java AntiLagService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/service/AntiLagService.java
        package com.antilag.service;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";
            private boolean isRunning = true;

            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                Notification notification = null;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    notification = new Notification.Builder(this, CHANNEL_ID)
                            .setContentTitle("Anti Lag Chạy Ngầm")
                            .setContentText("Hệ thống tối ưu hóa game đang hoạt động...")
                            .build();
                }
                startForeground(1, notification);

                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (isRunning) {
                            try {
                                System.loadLibrary("kk");
                                kichHoatChongLag();
                            } catch (UnsatisfiedLinkError e) {
                                e.printStackTrace();
                            }
                            try {
                                Thread.sleep(5000);
                            } catch (InterruptedException e) {
                                e.printStackTrace();
                            }
                        }
                    }
                }).start();
            }

            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Anti Lag Foreground Service",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onDestroy() {
                isRunning = false;
                super.onDestroy();
            }
        }
        EOF

    - name: Tải tệp thực thi cục bộ gradlew
      run: |
        wget https://githubusercontent.com -O gradlew
        chmod +x gradlew

    - name: Tiến hành Biên dịch hệ thống bằng Gradle Wrapper cục bộ
      run: ./gradlew :app:assembleDebug

    - name: Xuất bản và Lưu trữ thành phẩm File APK xuất đầu ra
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
