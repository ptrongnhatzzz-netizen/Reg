name: Build Anti-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/jniLibs/arm64-v8a

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Create Root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            alias(libs.plugins.android.application) apply false
        }
        EOF

    - name: Create gradle.properties
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

    - name: Create gradle/libs.versions.toml
      run: |
        mkdir -p gradle
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.5.0"

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        EOF

    - name: Create app/build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            alias(libs.plugins.android.application)
        }

        android {
            namespace 'com.antilag.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.app"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
                
                ndk {
                    abiFilters "arm64-v8a"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:label="Anti Lag Service"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:theme="@android:style/Theme.NoDisplay"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:foregroundServiceType="specialUse"
                    android:enabled="true"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: Create AntiLagService.java (JNI & Infinite Loop)
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";
            private boolean isRunning = true;

            // Khai báo hàm JNI gốc từ libkk.so
            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Anti-Lag Active")
                        .setContentText("Dịch vụ chống lag đang chạy ẩn ngầm...")
                        .setSmallIcon(android.R.drawable.ic_menu_info_details)
                        .build();
                
                // Khởi chạy Foreground Service vĩnh viễn
                startForeground(1, notification);

                // Khởi tạo luồng Thread chạy vòng lặp vô hạn nạp SO và gọi JNI mỗi 5 giây
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (isRunning) {
                            try {
                                // Liên tục nạp lại thư viện libkk.so
                                System.loadLibrary("kk");
                                // Gọi hàm JNI native
                                kichHoatChongLag();
                            } catch (UnsatisfiedLinkError e) {
                                e.printStackTrace();
                            }
                            
                            try {
                                Thread.sleep(5000);
                            } catch (InterruptedException e) {
                                e.printStackTrace();
                            }
                        }
                    }
                }).start();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY; // Đảm bảo hệ thống tự khởi động lại dịch vụ nếu bị crash
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onDestroy() {
                isRunning = false;
                super.onDestroy();
            }

            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Anti-Lag Service Channel",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }
        }
        EOF

    - name: Create MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/MainActivity.java
        package com.antilag.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // Kích hoạt Foreground Service ngay khi ấn vào app
                Intent serviceIntent = new Intent(this, AntiLagService.class);
                if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                
                // Kết thúc Activity ngay lập tức để không hiện giao diện (Theme.NoDisplay)
                finish();
            }
        }
        EOF

    - name: Copy libkk.so to jniLibs
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Đã sao chép thành công file libkk.so vào jniLibs!"
        else
          echo "LỖI: Không tìm thấy file libkk.so ở thư mục gốc!" && exit 1
        fi

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK with Gradle
      run: ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
