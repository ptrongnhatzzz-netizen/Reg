name: Đóng Gói Ứng Dụng Anti-Lag Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn (Checkout)
      uses: actions/checkout@v4

    - name: Thiết lập Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Thiết lập Android SDK
      uses: android-actions/setup-android@v3

    - name: Cài đặt và cấu hình Gradle v8.5 độc lập
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Khởi tạo cấu trúc thư mục dự án Android đầy đủ
      run: |
        mkdir -p app/src/main/java/com/antilag/service
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/res/values

    - name: Sao chép thư viện libkk.so vào cấu trúc JNI
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Đã sao chép libkk.so thành công."
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!" && exit 1
        fi

    - name: Tạo file settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Tạo file build.gradle (Gốc)
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
        }
        EOF

    - name: Tạo file app/build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.antilag.service'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.service"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
                
                ndk {
                    abiFilters "arm64-v8a"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

    - name: Tạo file chuỗi tài nguyên (strings.xml)
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Anti Lag Service</string>
        </resources>
        EOF

    - name: Tạo file AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.NoDisplay">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

